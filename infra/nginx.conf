server {
    listen 80;
    server_name foodgramnight.viewdns.net;
    client_max_body_size 10M;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name foodgramnight.viewdns.net;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/foodgramnight.viewdns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodgramnight.viewdns.net/privkey.pem;

    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/redoc.html;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }
}