volumes:
  pg_data_production:
  static_volume:
  media:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: nightviolet/foodgram_backend
    env_file: .env
    volumes:
      - static_volume:/backend_static
      - media:/app/media
  frontend:
    image: nightviolet/foodgram_frontend
    env_file: .env
    volumes:
      - ./frontend/:/app/result_build/
  gateway:
    image: nightviolet/foodgram_gateway
    env_file: .env
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/build:/usr/share/nginx/html/
      - ./docs/:/usr/share/nginx/html/api/docs/
      - static_volume:/static
      - media:/media
    ports:
      - 80:80